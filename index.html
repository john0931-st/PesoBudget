<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
    <title>PesoBudget - Smart Philippine Expense & Payroll Tracker</title>
    <meta name="description" content="PesoBudget: Smart Philippine Expense & Payroll Tracker with automated Metrobank/QR PH computations, Excel notes, biometrics and backup." />
    <meta property="og:title" content="PesoBudget - Smart Philippine Expense & Payroll Tracker" />
    <meta property="og:description" content="PesoBudget: Smart Philippine Expense & Payroll Tracker with automated Metrobank/QR PH computations, Excel notes, biometrics and backup." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pesobudget_theme_v1');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#020617');
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PesoBudget" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900 dark:selection:bg-emerald-900/60 dark:selection:text-emerald-100 overscroll-none transition-colors duration-150">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
